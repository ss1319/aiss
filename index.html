body{background:linear-gradient(135deg,#1a1a2e,#16213e,#0f3460);color:#eee}
/* ===== 顶部搜索栏 ===== */
.top{position:sticky;top:0;z-index:100;background:rgba(26,26,46,.9);backdrop-filter:blur(10px);padding:12px 16px;border-bottom:1px solid rgba(212,160,23,.3)}

/* 搜索标签 */
.search-tabs{display:flex;gap:4px;justify-content:center;margin-top:8px;flex-wrap:wrap}
.stab{padding:4px 14px;border:1px solid #d4a017;border-radius:15px;background:transparent;color:#aaa;cursor:pointer;font-size:13px}
.stab.active{background:#d4a017;color:#fff}
/* 搜索结果区 */
.search-result{display:none;max-width:1000px;margin:12px auto;background:rgba(255,255,255,.08);border-radius:12px;padding:12px;max-height:500px;overflow-y:auto}
.search-result::-webkit-scrollbar{width:3px}
.search-result::-webkit-scrollbar-thumb{background:#d4a017}
.sr-title{color:#f4d03f;font-size:15px;margin-bottom:8px}
.sr-item{padding:8px;background:rgba(255,255,255,.05);border-radius:8px;margin-bottom:6px;cursor:pointer;font-size:14px}
.sr-item:hover{background:rgba(212,160,23,.2)}
.sr-item .meta{font-size:12px;color:#999;margin-top:2px}
.sr-player{width:100%;height:400px;border:none;border-radius:8px;margin-top:8px}
.sr-music{display:flex;align-items:center;gap:10px;padding:8px;background:rgba(255,255,255,.05);border-radius:8px;margin-bottom:6px}
.sr-music img{width:50px;height:50px;border-radius:6px;object-fit:cover}
.sr-music .info{flex:1;font-size:13px}
.sr-music audio{width:150px;height:30px}
/* ===== 分类折叠区 ===== */

.cat{margin-bottom:16px}
.cat-header{padding:14px 18px;background:linear-gradient(135deg,rgba(212,160,23,.2),rgba(212,160,23,.05));border:1px solid rgba(212,160,23,.3);border-radius:12px;cursor:pointer;display:flex;justify-content:space-between;align-items:center;font-size:17px;color:#f4d03f;font-weight:bold}
.cat-header::after{content:"▼";font-size:12px;transition:.2s}
.cat.open .cat-header::after{transform:rotate(180deg)}
.cat-body{max-height:0;overflow:hidden;transition:max-height .3s}
.cat.open .cat-body{max-height:5000px}
.card-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px;padding:12px}
.card{display:block;padding:14px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.1);border-radius:10px;text-decoration:none;color:#eee;transition:.2s}
.card:hover{background:rgba(212,160,23,.15);transform:translateY(-2px)}
.card .icon{font-size:28px;margin-bottom:6px}
.card h4{font-size:15px;color:#f4d03f;margin-bottom:4px}
.card p{font-size:12px;color:#aaa}
/* ===== 悬浮客服 ===== */
.float-btns{position:fixed;right:0;bottom:20px;z-index:9999;display:flex;flex-direction:column;gap:8px;transition:transform .3s}
.float-btns.hide{transform:translateX(80px)}
.fab{width:32px;height:32px;border-radius:50%;border:none;cursor:pointer;font-size:16px;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 8px rgba(0,0,0,.3);transition:.2s}
.svc-fab{background:linear-gradient(135deg,#ff6b6b,#feca57,#48dbfb,#ff9ff3);animation:bounce 1.2s infinite,grad 4s infinite;color:#fff}
.back-top{background:linear-gradient(135deg,#667eea,#764ba2);color:#fff}
@keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
@keyframes grad{0%{filter:hue-rotate(0)}100%{filter:hue-rotate(360deg)}}
.svc-mask{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:9998;display:none}
.svc-mask.show{display:block}

function doSearch(){

    content.innerHTML='<iframe class="sr-player" src="https://www.bing.com/search?q='+encodeURIComponent(kw)+'"></iframe>';

/* 视频搜索：B站真实API */
function searchVideoAll(kw){
  var content=document.getElementById("srContent");
  fetch("https://api.bilibili.com/x/web-interface/search/all/v2?keyword="+encodeURIComponent(kw)+"&page=1")
    .then(function(r){return r.json();})
    .then(function(d){
      if(d.code!==0){content.innerHTML="API请求失败，请重试";return;}
      var vids=[];
      if(d.data&&d.data.result){
        d.data.result.forEach(function(r){
          if(r.result_type==="video"&&r.data)vids=vids.concat(r.data);
        });
      }
      if(!vids.length){content.innerHTML="无结果";return;}
      var html="";
      vids.slice(0,10).forEach(function(v){
        var t=v.title.replace(/<[^>]+>/g,"");
        html+='<div class="sr-item" onclick="playBili(\''+v.bvid+'\','+v.cid+')">'+t+'<div class="meta">UP: '+v.author+' · ▶'+v.play+' · 💬'+v.video_review+'</div></div>';
      });
      html+='<iframe class="sr-player" id="biliPlayer"></iframe>';
      content.innerHTML=html;
    })
    .catch(function(){content.innerHTML="网络错误，请检查网络";});
}
function playBili(bvid,cid){
  var p=document.getElementById("biliPlayer");
  p.src="https://player.bilibili.com/player.html?bvid="+bvid+"&cid="+cid+"&autoplay=1";
}

/* 音乐搜索：iTunes真实API */
function searchMusic(kw){
  var content=document.getElementById("srContent");

    .then(function(r){return r.json();})
    .then(function(d){
      if(!d.results||!d.results.length){content.innerHTML="无结果";return;}
      var html="";
      d.results.forEach(function(t){
        var art=(t.artworkUrl100||"").replace("100x100","200x200");
        html+='<div class="sr-music"><img src="'+art+'"><div class="info"><b>'+t.trackName+'</b><div style="color:#999">'+t.artistName+'</div></div>';
        if(t.previewUrl)html+='<audio controls src="'+t.previewUrl+'"></audio>';
        html+='</div>';
      });
      content.innerHTML=html;
    })
    .catch(function(){content.innerHTML="音乐搜索失败";});
}

var svcMask=document.getElementById("svcMask");
