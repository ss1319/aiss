<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;width:100%;font-family:"Microsoft YaHei","PingFang SC",sans-serif}
body{
  background:linear-gradient(135deg,#fff8e7 0%,#ffe9b8 50%,#fff3d6 100%);
  color:#3d2914;
  min-height:100%;
}
/* ===== 顶部搜索栏 ===== */
.top{
  position:sticky;top:0;z-index:100;
  background:rgba(255,255,255,.75);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  padding:16px 20px;border-bottom:1px solid rgba(212,160,23,.25);
  box-shadow:0 2px 20px rgba(212,160,23,.1);
}
.top h1{
  font-size:22px;text-align:center;margin-bottom:14px;
  background:linear-gradient(135deg,#b8860b,#d4a017,#f4d03f,#b8860b);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
  font-weight:bold;
}
.search-row{display:flex;gap:10px;max-width:800px;margin:0 auto}
.search-row input{
  flex:1;padding:12px 22px;border:2px solid #d4a017;border-radius:30px;
  font-size:16px;background:rgba(255,255,255,.95);outline:none;
  transition:.2s;
}
.search-row input:focus{border-color:#f4d03f;box-shadow:0 0 15px rgba(212,160,23,.2)}
.search-row button{
  padding:12px 32px;border:none;border-radius:30px;
  background:linear-gradient(135deg,#d4a017,#f4d03f);
  color:#fff;font-size:16px;cursor:pointer;font-weight:bold;
  box-shadow:0 4px 15px rgba(212,160,23,.3);
  transition:.2s;
}
.search-row button:hover{transform:translateY(-2px);box-shadow:0 6px 20px rgba(212,160,23,.4)}
/* 搜索标签 */
.search-tabs{display:flex;gap:6px;justify-content:center;margin-top:10px;flex-wrap:wrap}
.stab{
  padding:6px 18px;border:1.5px solid #d4a017;border-radius:20px;
  background:transparent;color:#8b6914;cursor:pointer;font-size:14px;
  transition:.2s;
}
.stab.active{background:linear-gradient(135deg,#d4a017,#f4d03f);color:#fff;border-color:transparent}
/* 搜索结果区 */
.search-result{
  display:none;max-width:900px;margin:14px auto;
  background:rgba(255,255,255,.8);border:1px solid rgba(212,160,23,.2);
  border-radius:16px;padding:16px;max-height:480px;overflow-y:auto;
  box-shadow:0 4px 20px rgba(212,160,23,.1);
}
.search-result::-webkit-scrollbar{width:3px}
.search-result::-webkit-scrollbar-thumb{background:#d4a017;border-radius:2px}
.sr-title{color:#b8860b;font-size:16px;margin-bottom:10px;font-weight:bold}
.sr-item{
  padding:10px 12px;background:rgba(255,248,230,.6);border-radius:10px;
  margin-bottom:8px;cursor:pointer;font-size:15px;transition:.2s;
  border-left:3px solid #d4a017;
}
.sr-item:hover{background:rgba(212,160,23,.12);transform:translateX(4px)}
.sr-item .meta{font-size:13px;color:#999;margin-top:3px}
.sr-player{width:100%;height:400px;border:none;border-radius:10px;margin-top:10px}
.sr-music{
  display:flex;align-items:center;gap:12px;padding:10px;
  background:rgba(255,248,230,.6);border-radius:10px;margin-bottom:8px;
}
.sr-music img{width:56px;height:56px;border-radius:8px;object-fit:cover;box-shadow:0 2px 8px rgba(0,0,0,.1)}
.sr-music .info{flex:1;font-size:14px}
.sr-music audio{width:160px;height:32px}
/* ===== 分类折叠区 ===== */
.main{max-width:1200px;margin:0 auto;padding:20px}
.cat{margin-bottom:18px}
.cat-header{
  padding:16px 20px;
  background:linear-gradient(135deg,rgba(212,160,23,.15),rgba(244,208,63,.08));
  border:1.5px solid rgba(212,160,23,.3);border-radius:16px;
  cursor:pointer;display:flex;justify-content:space-between;align-items:center;
  font-size:18px;color:#8b6914;font-weight:bold;
  transition:.2s;
}
.cat-header:hover{background:linear-gradient(135deg,rgba(212,160,23,.25),rgba(244,208,63,.15))}
.cat-header::after{content:"▼";font-size:13px;transition:.2s;color:#d4a017}
.cat.open .cat-header::after{transform:rotate(180deg)}
.cat-body{max-height:0;overflow:hidden;transition:max-height .4s ease}
.cat.open .cat-body{max-height:6000px}
.card-grid{
  display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));
  gap:14px;padding:16px;
}
.card{
  display:block;padding:18px;
  background:rgba(255,255,255,.85);backdrop-filter:blur(10px);
  border:1px solid rgba(212,160,23,.2);border-radius:14px;
  text-decoration:none;color:#3d2914;transition:.25s;
  box-shadow:0 2px 12px rgba(212,160,23,.08);
}
.card:hover{
  background:rgba(255,255,255,.95);
  transform:translateY(-4px);
  box-shadow:0 8px 25px rgba(212,160,23,.2);
  border-color:#d4a017;
}
.card .icon{font-size:32px;margin-bottom:8px}
.card h4{font-size:16px;color:#8b6914;margin-bottom:6px;font-weight:bold}
.card p{font-size:13px;color:#999;line-height:1.4}
/* ===== 悬浮客服 ===== */
.float-btns{
  position:fixed;right:0;bottom:24px;z-index:9999;
  display:flex;flex-direction:column;gap:10px;transition:transform .3s;
}
.float-btns.hide{transform:translateX(80px)}
.fab{
  width:32px;height:32px;border-radius:50%;border:none;cursor:pointer;
  font-size:16px;display:flex;align-items:center;justify-content:center;
  box-shadow:0 4px 12px rgba(0,0,0,.2);transition:.2s;
}
.svc-fab{
  background:linear-gradient(135deg,#ff6b6b,#feca57,#48dbfb,#ff9ff3);
  animation:bounce 1.2s infinite,grad 4s infinite;color:#fff;
}
.back-top{background:linear-gradient(135deg,#667eea,#764ba2);color:#fff}
@keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
@keyframes grad{0%{filter:hue-rotate(0)}100%{filter:hue-rotate(360deg)}}
.svc-mask{position:fixed;inset:0;background:rgba(0,0,0,.3);z-index:9998;display:none}
.svc-mask.show{display:block}
.svc-panel{
  position:fixed;right:0;top:0;width:300px;height:100%;
  background:rgba(255,252,240,.97);backdrop-filter:blur(20px);
  z-index:9999;padding:24px;overflow-y:auto;
  transform:translateX(100%);transition:transform .3s;display:none;
  box-shadow:-4px 0 20px rgba(0,0,0,.1);
}
.svc-panel.open{display:block;transform:translateX(0)}
.svc-panel::-webkit-scrollbar{width:1px}
.svc-panel::-webkit-scrollbar-thumb{background:rgba(212,160,23,.3)}
.panel-title{text-align:center;color:#8b6914;font-size:17px;margin-bottom:18px;font-weight:bold}
.qr-frame{
  width:160px;height:160px;margin:0 auto;
  border:2px solid #d4a017;border-radius:14px;overflow:hidden;background:#fff;
  box-shadow:0 4px 15px rgba(212,160,23,.2);
}
.qr-frame img{width:100%;height:100%;object-fit:cover}
.qr-name{text-align:center;color:#888;font-size:13px;margin-top:10px}
.qr-switch{
  display:block;margin:10px auto;padding:6px 16px;
  border:1.5px solid #d4a017;background:transparent;
  color:#8b6914;border-radius:16px;cursor:pointer;font-size:13px;
}
.qr-switch:hover{background:rgba(212,160,23,.1)}
.qr-tip{text-align:center;color:#999;font-size:13px;margin:10px 0}
.wx-id{text-align:center;margin:16px 0}
.wx-label{display:block;color:#999;font-size:13px;margin-bottom:4px}
.wx-line{
  display:block;font-size:22px;font-weight:bold;
  background:linear-gradient(90deg,#ff6b6b,#feca57,#48dbfb,#ff9ff3);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
  cursor:pointer;
}
.svc-links{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:14px}
.svc-link{
  width:48%;padding:10px;border-radius:10px;text-align:center;
  text-decoration:none;color:#fff;font-size:13px;display:block;
  transition:.2s;

.svc-link:hover{transform:scale(1.03)}
.c1{background:linear-gradient(135deg,#ff6b6b,#ee5a6f)}
.c2{background:linear-gradient(135deg,#48dbfb,#0abde3)}
.c3{background:linear-gradient(135deg,#ff9ff3,#f368e0)}
.c4{background:linear-gradient(135deg,#54a0ff,#5f27cd)}
.c5{background:linear-gradient(135deg,#54ca6b,#27ae60)}
.c6{background:linear-gradient(135deg,#ff9f43,#e67e22)}
.c7{background:linear-gradient(135deg,#00d2d3,#01a3a8)}
.c8{background:linear-gradient(135deg,#a55eea,#8854d0)}
@media(max-width:600px){
  .card-grid{grid-template-columns:repeat(2,1fr);gap:10px;padding:12px}
  .top h1{font-size:18px}
  .card{padding:14px}
  .card .icon{font-size:26px}
}
</style>

/* 搜索 */
var curTab="video";

    document.querySelectorAll(".stab").forEach(function(x){x.classList.remove("active");});
    s.classList.add("active");curTab=s.dataset.stab;
  };
});
document.getElementById("kw").addEventListener("keydown",function(e){if(e.key==="Enter")doSearch();});
function doSearch(){
  var kw=document.getElementById("kw").value.trim();
  if(!kw)return;
  var box=document.getElementById("srBox");
  var title=document.getElementById("srTitle");
  var content=document.getElementById("srContent");
  box.style.display="block";
  if(curTab==="video"){title.textContent="📺 搜索视频："+kw;content.innerHTML='<div style="text-align:center;padding:30px;color:#999">加载中...</div>';searchVideo(kw);}

  else if(curTab==="web"){title.textContent="🌐 网页搜索："+kw;content.innerHTML='<iframe class="sr-player" src="https://www.bing.com/search?q='+encodeURIComponent(kw)+'"></iframe>';}
}
function searchVideo(kw){
  var content=document.getElementById("srContent");
  fetch("https://api.bilibili.com/x/web-interface/search/all/v2?keyword="+encodeURIComponent(kw)+"&page=1")
    .then(function(r){return r.json();})
    .then(function(d){
      if(d.code!==0){content.innerHTML="请求失败，请重试";return;}
      var vids=[];
      if(d.data&&d.data.result){d.data.result.forEach(function(r){if(r.result_type==="video"&&r.data)vids=vids.concat(r.data);});}
      if(!vids.length){content.innerHTML="无结果";return;}
      var html="";
      vids.slice(0,10).forEach(function(v){
        var t=v.title.replace(/<[^>]+>/g,"");
        html+='<div class="sr-item" onclick="playBili(\''+v.bvid+'\','+v.cid+')">'+t+'<div class="meta">UP: '+v.author+' · ▶'+v.play+' · 💬'+v.video_review+'</div></div>';
      });
      html+='<iframe class="sr-player" id="biliPlayer"></iframe>';
      content.innerHTML=html;
    })
    .catch(function(){content.innerHTML="网络错误，请检查网络";});
}
function playBili(bvid,cid){document.getElementById("biliPlayer").src="https://player.bilibili.com/player.html?bvid="+bvid+"&cid="+cid+"&autoplay=1";}
function searchMusic(kw){
  var content=document.getElementById("srContent");
  fetch("https://itunes.apple.com/search?term="+encodeURIComponent(kw)+"&media=music&limit=15")
    .then(function(r){return r.json();})
    .then(function(d){
      if(!d.results||!d.results.length){content.innerHTML="无结果";return;}
      var html="";
      d.results.forEach(function(t){
        var art=(t.artworkUrl100||"").replace("100x100","200x200");
        html+='<div class="sr-music"><img src="'+art+'"><div class="info"><b>'+t.trackName+'</b><div style="color:#999">'+t.artistName+'</div></div>';
        if(t.previewUrl)html+='<audio controls src="'+t.previewUrl+'"></audio>';
        html+='</div>';
      });
      content.innerHTML=html;
    })
    .catch(function(){content.innerHTML="音乐搜索失败";});
}
