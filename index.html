<head>
<meta charset="UTF-8">

<title>全国中文AI大全 - 智能体/Agent/RPA/离线部署配置教程</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;width:100%;font-family:"Microsoft YaHei","PingFang SC",sans-serif}
body{background:linear-gradient(135deg,#fff8e7,#ffe9b8,#fff3d6);color:#3d2914;min-height:100%}
/* 1px金色滚动条 */
::-webkit-scrollbar{width:1px;height:1px}
::-webkit-scrollbar-thumb{background:#d4a017}
::-webkit-scrollbar-track{background:transparent}
/* 顶部 */
.top{position:sticky;top:0;z-index:100;background:rgba(255,255,255,.9);backdrop-filter:blur(20px);padding:14px 20px;border-bottom:1px solid rgba(212,160,23,.25)}
.top h1{font-size:20px;text-align:center;margin-bottom:12px;background:linear-gradient(135deg,#b8860b,#d4a017);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.search-row{display:flex;gap:8px;max-width:700px;margin:0 auto}
.search-row input{flex:1;padding:10px 18px;border:1.5px solid #d4a017;border-radius:25px;font-size:15px;background:#fff;outline:none}
.search-row button{padding:10px 24px;border:none;border-radius:25px;background:linear-gradient(135deg,#d4a017,#f4d03f);color:#fff;font-size:15px;cursor:pointer;font-weight:bold}
.search-tabs{display:flex;gap:6px;justify-content:center;margin-top:10px;flex-wrap:wrap}
.stab{padding:5px 16px;border:1.5px solid #d4a017;border-radius:18px;background:transparent;color:#8b6914;cursor:pointer;font-size:13px}
.stab.active{background:linear-gradient(135deg,#d4a017,#f4d03f);color:#fff;border-color:transparent}
.sr-box{display:none;max-width:900px;margin:12px auto;background:#fff;border:1px solid rgba(212,160,23,.2);border-radius:12px;overflow:hidden}
.sr-title{padding:10px 14px;background:rgba(212,160,23,.1);font-size:15px;color:#8b6914;font-weight:bold}
.sr-content{padding:14px;max-height:500px;overflow-y:auto}
.sr-content iframe{width:100%;height:450px;border:0}
/* AI分类 */
.main{max-width:1100px;margin:0 auto;padding:20px}
.cat{margin-bottom:14px}
.cat-header{padding:14px 18px;background:linear-gradient(135deg,rgba(212,160,23,.15),rgba(244,208,63,.08));border:1px solid rgba(212,160,23,.3);border-radius:14px;cursor:pointer;display:flex;justify-content:space-between;align-items:center;font-size:17px;color:#8b6914;font-weight:bold}
.cat-header::after{content:"▼";font-size:12px;color:#d4a017;transition:.2s}
.cat.open .cat-header::after{transform:rotate(180deg)}
.cat-body{max-height:0;overflow:hidden;transition:max-height .4s}
.cat.open .cat-body{max-height:5000px}
.card-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px;padding:14px}
.card{display:block;padding:14px;background:rgba(255,255,255,.9);border:1px solid rgba(212,160,23,.2);border-radius:12px;text-decoration:none;color:#3d2914;transition:.2s}
.card:hover{background:#fff;box-shadow:0 4px 15px rgba(212,160,23,.15);transform:translateY(-2px)}
.card .icon{font-size:28px;margin-bottom:6px}
.card h4{font-size:15px;color:#8b6914;margin-bottom:4px}
.card p{font-size:12px;color:#999}
/* 悬浮客服 */
.float-btns{position:fixed;right:0;bottom:20px;z-index:9999;display:flex;flex-direction:column;gap:8px;transition:transform .3s}
.float-btns.hide{transform:translateX(80px)}
.fab{width:32px;height:32px;border-radius:50%;border:none;cursor:pointer;font-size:16px;display:flex;align-items:center;justify-content:center;box-shadow:0 3px 10px rgba(0,0,0,.2)}
.svc-fab{background:linear-gradient(135deg,#ff6b6b,#feca57,#48dbfb,#ff9ff3);animation:bounce 1.2s infinite,grad 4s infinite;color:#fff}
.back-top{background:linear-gradient(135deg,#667eea,#764ba2);color:#fff}
@keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
@keyframes grad{0%{filter:hue-rotate(0)}100%{filter:hue-rotate(360deg)}}
.svc-mask{position:fixed;inset:0;background:rgba(0,0,0,.3);z-index:9998;display:none}
.svc-mask.show{display:block}
.svc-panel{position:fixed;right:0;top:0;width:300px;height:100%;background:rgba(255,252,240,.97);backdrop-filter:blur(20px);z-index:9999;padding:24px;overflow-y:auto;transform:translateX(100%);transition:transform .3s;display:none}
.svc-panel.open{display:block;transform:translateX(0)}
.svc-panel::-webkit-scrollbar{width:1px}
.svc-panel::-webkit-scrollbar-thumb{background:#d4a017}
.panel-title{text-align:center;color:#8b6914;font-size:17px;margin-bottom:18px;font-weight:bold}
.qr-frame{width:160px;height:160px;margin:0 auto;border:2px solid #d4a017;border-radius:14px;overflow:hidden;background:#fff}
.qr-frame img{width:100%;height:100%;object-fit:cover}
.qr-name{text-align:center;color:#888;font-size:13px;margin-top:10px}
.qr-switch{display:block;margin:10px auto;padding:6px 16px;border:1.5px solid #d4a017;background:transparent;color:#8b6914;border-radius:16px;cursor:pointer;font-size:13px}
.qr-tip{text-align:center;color:#999;font-size:13px;margin:10px 0}
.wx-id{text-align:center;margin:16px 0}
.wx-label{display:block;color:#999;font-size:13px}
.wx-line{display:block;font-size:22px;font-weight:bold;background:linear-gradient(90deg,#ff6b6b,#feca57,#48dbfb,#ff9ff3);-webkit-background-clip:text;-webkit-text-fill-color:transparent;cursor:pointer}
.svc-links{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:14px}
.svc-link{width:48%;padding:10px;border-radius:10px;text-align:center;text-decoration:none;color:#fff;font-size:13px;display:block}
.c1{background:linear-gradient(135deg,#ff6b6b,#ee5a6f)}.c2{background:linear-gradient(135deg,#48dbfb,#0abde3)}
.c3{background:linear-gradient(135deg,#ff9ff3,#f368e0)}.c4{background:linear-gradient(135deg,#54a0ff,#5f27cd)}
.c5{background:linear-gradient(135deg,#54ca6b,#27ae60)}.c6{background:linear-gradient(135deg,#ff9f43,#e67e22)}
.c7{background:linear-gradient(135deg,#00d2d3,#01a3a8)}.c8{background:linear-gradient(135deg,#a55eea,#8854d0)}
@media(max-width:600px){.card-grid{grid-template-columns:repeat(2,1fr);gap:8px;padding:10px}.top h1{font-size:16px}}
</style>
</head>

/* 渲染分类 */
var list=document.getElementById("aiList");
cats.forEach(function(cat,idx){
  var d=document.createElement("div");
  d.className="cat"+(idx===0?" open":"");
  var g=cat.items.map(function(it){
    return '<a class="card" href="pages/'+it.f+'.html"><div class="icon">'+it.i+'</div><h4>'+it.n+'</h4><p>'+it.d+'</p></a>';
  }).join("");

  list.appendChild(d);
});

/* ===== 万能嗅探搜索 - iframe方式确保可用 ===== */
var curTab="video";
document.querySelectorAll(".stab").forEach(function(s){
  s.onclick=function(){
    document.querySelectorAll(".stab").forEach(function(x){x.classList.remove("active");});
    s.classList.add("active");curTab=s.dataset.s;
  };
});
document.getElementById("kw").addEventListener("keydown",function(e){if(e.key==="Enter")doSearch();});

function doSearch(){
  var kw=document.getElementById("kw").value.trim();
  if(!kw){alert("请输入关键词");return;}
  var box=document.getElementById("srBox");
  var title=document.getElementById("srTitle");
  var content=document.getElementById("srContent");
  box.style.display="block";
  var enc=encodeURIComponent(kw);
  if(curTab==="video"){
    title.textContent="📺 视频搜索："+kw;
    content.innerHTML='<iframe src="https://search.bilibili.com/all?keyword='+enc+'"></iframe>';
  } else if(curTab==="music"){
    title.textContent="🎵 音乐搜索："+kw;
    content.innerHTML='<iframe src="https://music.163.com/#/search/m/?s='+enc+'&type=1"></iframe>';
  } else if(curTab==="news"){
    title.textContent="📰 新闻搜索："+kw;
    content.innerHTML='<iframe src="https://www.baidu.com/s?wd='+enc+'&tn=news"></iframe>';
  } else if(curTab==="article"){
    title.textContent="📄 文章搜索："+kw;
    content.innerHTML='<iframe src="https://weixin.sogou.com/weixin?type=2&query='+enc+'&ie=utf8"></iframe>';
  } else if(curTab==="image"){
    title.textContent="🖼️ 图片搜索："+kw;
    content.innerHTML='<iframe src="https://image.baidu.com/search/index?tn=baiduimage&word='+enc+'"></iframe>';
  } else if(curTab==="weibo"){
    title.textContent="🔥 微博热搜："+kw;
    content.innerHTML='<iframe src="https://s.weibo.com/weibo?q='+enc+'"></iframe>';
  }
  box.scrollIntoView({behavior:"smooth"});
}

/* 客服 */

svcToggle.onclick=function(e){e.stopPropagation();svcPanel.classList.toggle("open");svcMask.classList.toggle("show");};
svcMask.onclick=function(){svcPanel.classList.remove("open");svcMask.classList.remove("show");};
document.onclick=function(e){if(svcPanel.classList.contains("open")&&!svcPanel.contains(e.target)&&e.target!==svcToggle){svcPanel.classList.remove("open");svcMask.classList.remove("show");}};
document.addEventListener("keydown",function(e){if(e.key==="Escape"){svcPanel.classList.remove("open");svcMask.classList.remove("show");}});

document.getElementById("wxLine").onmouseleave=function(){this.style.opacity="1";};
document.getElementById("backTop").onclick=function(){window.scrollTo({top:0,behavior:"smooth"});};
var scrollT;window.onscroll=function(){
  document.getElementById("floatBtns").classList.add("hide");
  clearTimeout(scrollT);scrollT=setTimeout(function(){document.getElementById("floatBtns").classList.remove("hide");},300);
};
