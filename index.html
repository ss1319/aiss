.stab{padding:6px 16px;border:1.5px solid #d4a017;border-radius:18px;background:transparent;color:#8b6914;cursor:pointer;font-size:14px}

.cat-header::after{content:"▼";font-size:12px;color:#d4a017;transition:.2s}

.cat-body{max-height:0;overflow:hidden;transition:max-height .4s}
.cat.open .cat-body{max-height:9999px}
.card-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px;padding:14px}
.card{display:block;padding:16px;background:rgba(255,255,255,.9);border:1px solid rgba(212,160,23,.2);border-radius:12px;text-decoration:none;color:#3d2914;transition:.2s}
.card:hover{background:#fff;box-shadow:0 4px 15px rgba(212,160,23,.15);transform:translateY(-2px)}
.card .icon{font-size:30px;margin-bottom:6px}
.card h4{font-size:16px;color:#8b6914;margin-bottom:4px}
.card p{font-size:13px;color:#999}
.float-btns{position:fixed;right:0;bottom:20px;z-index:9999;display:flex;flex-direction:column;gap:8px;transition:transform .3s}
.float-btns.hide{transform:translateX(80px)}
.fab{width:32px;height:32px;border-radius:50%;border:none;cursor:pointer;font-size:14px;display:flex;align-items:center;justify-content:center;box-shadow:0 3px 10px rgba(0,0,0,.2)}

.back-top{background:linear-gradient(135deg,#1abc9c,#2ecc71);color:#fff}

.svc-mask{position:fixed;inset:0;background:rgba(0,0,0,.3);z-index:9998;display:none}

.svc-panel{position:fixed;right:0;top:0;width:300px;height:100%;background:rgba(255,252,240,.97);backdrop-filter:blur(20px);z-index:9999;padding:24px;overflow-y:auto;transform:translateX(100%);transition:transform .3s;display:none}

});
document.getElementById("kw").addEventListener("keydown",function(e){if(e.key==="Enter")doSearch();});
function doSearch(){
  var kw=document.getElementById("kw").value.trim();
  if(!kw){alert("请输入关键词");return;}
  document.getElementById("srBox").style.display="block";
  document.getElementById("srTitle").textContent="🔍 "+kw;
  var enc=encodeURIComponent(kw);
  var urls={
    video:'https://search.bilibili.com/all?keyword='+enc,
    music:'https://music.163.com/#/search/m/?s='+enc+'&type=1',
    article:'https://weixin.sogou.com/weixin?type=2&query='+enc+'&ie=utf8',
    image:'https://image.baidu.com/search/index?tn=baiduimage&word='+enc,
    anime:'https://search.bilibili.com/anime?keyword='+enc,
    up:'https://search.bilibili.com/upuser?keyword='+enc
  };
  document.getElementById("srContent").innerHTML='<iframe src="'+urls[curTab]+'"></iframe>';
  document.getElementById("srBox").scrollIntoView({behavior:"smooth"});
}

document.onclick=function(e){if(sp.classList.contains("open")&&!sp.contains(e.target)&&e.target!==st){sp.classList.remove("open");sm.classList.remove("show");}};
