<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>阿里云百炼 - 配置教程</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{font-family:"Microsoft YaHei","PingFang SC",sans-serif}
body{background:linear-gradient(135deg,#fff8e7,#ffe9b8,#fff3d6);min-height:100%;color:#3d2914}
.top{position:sticky;top:0;z-index:100;background:rgba(255,255,255,.8);backdrop-filter:blur(20px);padding:16px 20px;border-bottom:1px solid rgba(212,160,23,.25);box-shadow:0 2px 15px rgba(212,160,23,.1)}
.top h1{font-size:22px;background:linear-gradient(135deg,#b8860b,#d4a017);-webkit-background-clip:text;-webkit-text-fill-color:transparent;text-align:center}
.back{position:absolute;left:16px;top:50%;transform:translateY(-50%);padding:8px 16px;background:linear-gradient(135deg,#d4a017,#f4d03f);color:#fff;border:none;border-radius:20px;cursor:pointer;font-size:14px;text-decoration:none}
.wrap{max-width:900px;margin:0 auto;padding:24px}
.hero{text-align:center;padding:30px 20px;background:rgba(255,255,255,.8);border-radius:20px;border:1px solid rgba(212,160,23,.2);margin-bottom:20px}
.hero .big-icon{font-size:64px;margin-bottom:10px}
.hero h2{font-size:28px;color:#8b6914;margin-bottom:8px}
.hero .cat{display:inline-block;padding:4px 14px;background:rgba(212,160,23,.15);color:#8b6914;border-radius:15px;font-size:14px;margin-bottom:12px}
.hero p{font-size:16px;color:#666;line-height:1.7}
.section{background:rgba(255,255,255,.8);border-radius:16px;padding:20px;margin-bottom:16px;border:1px solid rgba(212,160,23,.15)}
.section h3{font-size:20px;color:#8b6914;margin-bottom:14px;padding-bottom:8px;border-bottom:2px solid rgba(212,160,23,.2)}
.feat-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.feat{padding:12px;background:rgba(255,248,230,.6);border-radius:10px;font-size:15px;text-align:center}
.steps{counter-reset:step}
.step{padding:12px 16px;margin-bottom:8px;background:rgba(255,248,230,.6);border-radius:10px;font-size:15px;line-height:1.6;border-left:4px solid #d4a017}
.cta{display:inline-block;padding:14px 32px;background:linear-gradient(135deg,#d4a017,#f4d03f);color:#fff;text-decoration:none;border-radius:25px;font-size:16px;font-weight:bold;box-shadow:0 4px 15px rgba(212,160,23,.3);transition:.2s}
.cta:hover{transform:translateY(-2px);box-shadow:0 6px 20px rgba(212,160,23,.4)}
.float-btns{position:fixed;right:0;bottom:24px;z-index:9999;display:flex;flex-direction:column;gap:10px;transition:transform .3s}
.float-btns.hide{transform:translateX(80px)}
.fab{width:32px;height:32px;border-radius:50%;border:none;cursor:pointer;font-size:16px;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 12px rgba(0,0,0,.2)}
.svc-fab{background:linear-gradient(135deg,#ff6b6b,#feca57,#48dbfb,#ff9ff3);animation:bounce 1.2s infinite,grad 4s infinite;color:#fff}
.back-top{background:linear-gradient(135deg,#667eea,#764ba2);color:#fff}
@keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
@keyframes grad{0%{filter:hue-rotate(0)}100%{filter:hue-rotate(360deg)}}
.svc-mask{position:fixed;inset:0;background:rgba(0,0,0,.3);z-index:9998;display:none}
.svc-mask.show{display:block}
.svc-panel{position:fixed;right:0;top:0;width:300px;height:100%;background:rgba(255,252,240,.97);backdrop-filter:blur(20px);z-index:9999;padding:24px;overflow-y:auto;transform:translateX(100%);transition:transform .3s;display:none;box-shadow:-4px 0 20px rgba(0,0,0,.1)}
.svc-panel.open{display:block;transform:translateX(0)}
.svc-panel::-webkit-scrollbar{width:1px}
.svc-panel::-webkit-scrollbar-thumb{background:rgba(212,160,23,.3)}
.panel-title{text-align:center;color:#8b6914;font-size:17px;margin-bottom:18px;font-weight:bold}
.qr-frame{width:160px;height:160px;margin:0 auto;border:2px solid #d4a017;border-radius:14px;overflow:hidden;background:#fff}
.qr-frame img{width:100%;height:100%;object-fit:cover}
.qr-name{text-align:center;color:#888;font-size:13px;margin-top:10px}
.qr-switch{display:block;margin:10px auto;padding:6px 16px;border:1.5px solid #d4a017;background:transparent;color:#8b6914;border-radius:16px;cursor:pointer;font-size:13px}
.qr-tip{text-align:center;color:#999;font-size:13px;margin:10px 0}
.wx-id{text-align:center;margin:16px 0}
.wx-label{display:block;color:#999;font-size:13px}
.wx-line{display:block;font-size:22px;font-weight:bold;background:linear-gradient(90deg,#ff6b6b,#feca57,#48dbfb,#ff9ff3);-webkit-background-clip:text;-webkit-text-fill-color:transparent;cursor:pointer}
.svc-links{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:14px}
.svc-link{width:48%;padding:10px;border-radius:10px;text-align:center;text-decoration:none;color:#fff;font-size:13px;display:block}
.c1{background:linear-gradient(135deg,#ff6b6b,#ee5a6f)}.c2{background:linear-gradient(135deg,#48dbfb,#0abde3)}
.c3{background:linear-gradient(135deg,#ff9ff3,#f368e0)}.c4{background:linear-gradient(135deg,#54a0ff,#5f27cd)}
.c5{background:linear-gradient(135deg,#54ca6b,#27ae60)}.c6{background:linear-gradient(135deg,#ff9f43,#e67e22)}
.c7{background:linear-gradient(135deg,#00d2d3,#01a3a8)}.c8{background:linear-gradient(135deg,#a55eea,#8854d0)}
</style>
</head>
<body>
<div class="top">
  <a class="back" href="../index.html">← 返回</a>
  <h1>☁️ 阿里云百炼</h1>
</div>
<div class="wrap">
  <div class="hero">
    <div class="big-icon">☁️</div>
    <h2>阿里云百炼</h2>
    <div class="cat">API类类AI</div>
    <p>阿里云大模型服务平台</p>
  </div>
  <div class="section">
    <h3>✨ 核心特点</h3>
    <div class="feat-grid"><div class="feat">✓ 通义千问</div><div class="feat">✓ Qwen模型</div><div class="feat">✓ RAG</div><div class="feat">✓ Agent</div></div>
  </div>
  <div class="section">
    <h3>🚀 使用教程</h3>
    <div class="steps"><div class="step">1. 登录阿里云</div><div class="step">2. 开通百炼服务</div><div class="step">3. 创建API Key</div><div class="step">4. 调用接口</div></div>
  </div>
  <div class="section" style="text-align:center">
    <h3>🔗 官方地址</h3>
    <a class="cta" href="https://dashscope.aliyun.com" target="_blank">立即访问 阿里云百炼 →</a>
  </div>
</div>
<div class="float-btns" id="floatBtns">
  <button class="fab svc-fab" id="svcToggle">💬</button>
  <button class="fab back-top" id="backTop">🚀</button>
</div>
<div class="svc-mask" id="svcMask"></div>
<div class="svc-panel" id="svcPanel">
  <div class="panel-title">💬 联系客服</div>
  <div class="qr-frame"><img id="qrImg" src="https://ss1319.github.io/aiss/assets/img/zsm.png"></div>
  <div class="qr-name" id="qrName">赞赏二维码</div>
  <button class="qr-switch" onclick="switchQr()">切换到公众号</button>
  <p class="qr-tip">欢迎自愿赞赏支持作者</p>
  <div class="wx-id"><span class="wx-label">微信公众号</span><span class="wx-line" id="wxLine">wxsy1349</span></div>
  <div class="svc-links">
    <a class="svc-link c1" href="https://app.kwaixiaodian.com/page/kwaishop-store-c-frame-h5/frame?layoutType=4&hyId=kwaishop-store-c-frame-h5&sellerId=1865090819&authorId=1865090819&carrierType=29&carrierId=fva0b4kfnGw&entrance=xdhtlj" target="_blank">🛒 快手小店</a>
    <a class="svc-link c2" href="https://pd.qq.com/s/24yp7y38f" target="_blank">💬 腾讯频道</a>
    <a class="svc-link c3" href="https://www.zhihu.com/people/z6391" target="_blank">💡 知乎</a>
    <a class="svc-link c4" href="https://qm.qq.com/q/VHeRTTdQcu" target="_blank">👥 QQ群</a>
    <a class="svc-link c5" href="https://bolt.cello.so/lsypink3QTR" target="_blank">⚡ 在线编程</a>
    <a class="svc-link c6" href="https://api.u-claw.org/register?aff=9OLG" target="_blank">🦞 OpenClaw</a>
    <a class="svc-link c7" href="https://weibo.com/zdzqxt" target="_blank">📢 微博</a>
    <a class="svc-link c8" href="https://txc.qq.com/embed/367382/new-post/" target="_blank">✍️ 欢迎留言</a>
  </div>
</div>
<script>
var svcToggle=document.getElementById("svcToggle");
var svcPanel=document.getElementById("svcPanel");
var svcMask=document.getElementById("svcMask");
svcToggle.onclick=function(e){e.stopPropagation();svcPanel.classList.toggle("open");svcMask.classList.toggle("show");};
svcMask.onclick=function(){svcPanel.classList.remove("open");svcMask.classList.remove("show");};
document.onclick=function(e){if(svcPanel.classList.contains("open")&&!svcPanel.contains(e.target)&&e.target!==svcToggle){svcPanel.classList.remove("open");svcMask.classList.remove("show");}};
document.addEventListener("keydown",function(e){if(e.key==="Escape"){svcPanel.classList.remove("open");svcMask.classList.remove("show");}});
var wxQr=false;
function switchQr(){
  wxQr=!wxQr;
  document.getElementById("qrImg").src=wxQr?"https://ss1319.github.io/aiss/assets/img/wxsy1349.png":"https://ss1319.github.io/aiss/assets/img/zsm.png";
  document.getElementById("qrName").textContent=wxQr?"微信公众号":"赞赏二维码";
  event.target.textContent=wxQr?"切换到赞赏码":"切换到公众号";
}
document.getElementById("wxLine").onmouseenter=function(){navigator.clipboard.writeText("wxsy1349");this.style.opacity="0.7";};
document.getElementById("wxLine").onmouseleave=function(){this.style.opacity="1";};
document.getElementById("backTop").onclick=function(){window.scrollTo({top:0,behavior:"smooth"});};
var scrollT;window.onscroll=function(){
  document.getElementById("floatBtns").classList.add("hide");
  clearTimeout(scrollT);scrollT=setTimeout(function(){document.getElementById("floatBtns").classList.remove("hide");},300);
};
</script>
</body>
</html>
